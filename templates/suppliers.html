{% extends 'base.html' %}{% block content %}<div class="top"><div><h1>Suppliers</h1><p>Supplier management</p></div></div><div class="grid2"><form class="panel" method="post"><h2>Add Supplier</h2><input name="name" placeholder="Supplier name" required><input name="phone" placeholder="Phone"><input name="email" placeholder="Email"><textarea name="address" placeholder="Address"></textarea><button>Add Supplier</button></form><section class="panel"><h2>Supplier List</h2><table><tr><th>Name</th><th>Phone</th><th>Email</th><th></th></tr>{% for s in suppliers %}<tr><td>{{s.name}}</td><td>{{s.phone}}</td><td>{{s.email}}</td><td><form method="post" action="{{url_for('supplier_delete',id=s.id)}}"><button class="danger small">Delete</button></form></td></tr>{% endfor %}</table></section></div>{% endblock %}
