{% extends 'base.html' %}{% block content %}<div class="top"><div><h1>Billing Portal</h1><p>Select products, collect payment and print invoice</p></div></div><div class="billing"><section class="panel"><h2>Products</h2><input id="search" placeholder="Search product or SKU..." oninput="filterProducts()"><div id="products" class="product-grid">{% for p in products %}<button class="product" data-name="{{p.name|lower}} {{p.sku|lower}}" onclick="add({{p.id}},'{{p.name|replace("'","\\'")}}',{{p.price}},{{p.stock}})"><b>{{p.name}}</b><span>{{p.sku}}</span><strong>₹{{p.price}}</strong><small>Stock: {{p.stock}}</small></button>{% endfor %}</div></section><section class="panel"><h2>Cart</h2><div id="cart"></div><div class="totals"><label>Discount <input id="discount" type="number" value="0" min="0" oninput="render()"></label><label>Tax % <input id="tax" type="number" value="0" min="0" oninput="render()"></label><select id="payment"><option>Cash</option><option>UPI</option><option>Card</option></select><h3>Total <span id="total">₹0.00</span></h3><button onclick="checkout()">Complete Payment & Generate Bill</button></div></section></div><script src="{{url_for('static',filename='billing.js')}}"></script>{% endblock %}
