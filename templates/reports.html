{% extends 'base.html' %}{% block content %}<div class="top"><div><h1>Reports</h1><p>Sales trends and top products</p></div></div><div class="grid2"><section class="panel"><h2>Daily Sales</h2><table><tr><th>Date</th><th>Bills</th><th>Revenue</th></tr>{% for x in daily %}<tr><td>{{x.day}}</td><td>{{x.bills}}</td><td>₹{{x.revenue}}</td></tr>{% endfor %}</table></section><section class="panel"><h2>Top Products</h2><table><tr><th>Product</th><th>Qty</th><th>Revenue</th></tr>{% for x in top %}<tr><td>{{x.name}}</td><td>{{x.qty}}</td><td>₹{{x.revenue}}</td></tr>{% endfor %}</table></section></div>{% endblock %}
