{% extends 'base.html' %}{% block content %}<div class="top"><div><h1>Product Returns</h1><p>Process returns and restore stock</p></div></div><div class="grid2"><form class="panel" method="post"><h2>New Return</h2><select name="product_id" required><option value="">Select product</option>{% for p in products %}<option value="{{p.id}}">{{p.name}} ({{p.sku}})</option>{% endfor %}</select><input name="sale_id" placeholder="Sale ID (optional)"><input name="qty" type="number" min="1" placeholder="Quantity" required><textarea name="reason" placeholder="Reason"></textarea><button>Process Return</button></form><section class="panel"><h2>Return History</h2><table><tr><th>Product</th><th>Qty</th><th>Amount</th><th>Reason</th><th>Date</th></tr>{% for r in returns %}<tr><td>{{r.name}}</td><td>{{r.qty}}</td><td>₹{{r.amount}}</td><td>{{r.reason}}</td><td>{{r.created_at}}</td></tr>{% endfor %}</table></section></div>{% endblock %}
