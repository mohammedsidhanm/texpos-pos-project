{% extends 'base.html' %}{% block content %}<div class="top"><div><h1>Products</h1><p>Product CRUD and inventory</p></div></div><div class="grid2"><form class="panel" method="post"><h2>Add Product</h2><input name="name" placeholder="Product name" required><input name="sku" placeholder="SKU" required><div class="row"><input name="category" placeholder="Category"><input name="size" placeholder="Size"></div><div class="row"><input name="color" placeholder="Color"><input name="price" type="number" step="0.01" placeholder="Price" required></div><div class="row"><input name="stock" type="number" placeholder="Stock" value="0"><input name="reorder_level" type="number" placeholder="Reorder level" value="5"></div><select name="supplier_id"><option value="">Supplier</option>{% for s in suppliers %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select><button>Add Product</button></form><section class="panel"><h2>Inventory</h2><table><tr><th>Item</th><th>SKU</th><th>Price</th><th>Stock</th><th></th></tr>{% for p in products %}<tr><td>{{p.name}}<small>{{p.category or ''}} {{p.size or ''}}</small></td><td>{{p.sku}}</td><td>₹{{p.price}}</td><td class="{% if p.stock<=p.reorder_level %}low{% endif %}">{{p.stock}}</td><td><form method="post" action="{{url_for('product_delete',id=p.id)}}" onsubmit="return confirm('Delete product?')"><button class="danger small">Delete</button></form></td></tr>{% endfor %}</table></section></div>{% endblock %}
