{% extends 'base.html' %}{% block content %}<div class="top"><div><h1>Ledger</h1><p>Sales and return accounting entries</p></div><div class="metric">Net ₹{{'%.2f'|format(total)}}</div></div><section class="panel"><table><tr><th>Type</th><th>Reference</th><th>Description</th><th>Amount</th><th>Date</th></tr>{% for x in ledger %}<tr><td>{{x.entry_type}}</td><td>{{x.reference}}</td><td>{{x.description}}</td><td class="{{'negative' if x.amount<0 else ''}}">₹{{'%.2f'|format(x.amount)}}</td><td>{{x.created_at}}</td></tr>{% endfor %}</table></section>{% endblock %}
